services:
  - type: web
    name: pakomi-backend
    runtime: node
    rootDir: backend
    buildCommand: "npm install && npx prisma generate && npm run build && npx prisma db push && npm run seed"
    startCommand: "npm start"
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pakomi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pakomi-frontend.onrender.com
      - key: PORT
        value: "3001"
    autoDeploy: true
    plan: free

  - type: web
    name: pakomi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://pakomi-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
    autoDeploy: true

databases:
  - name: pakomi-db
    plan: free
